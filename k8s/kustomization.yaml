apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: order-service
resources:
  - namespace.yaml
  - postgres.yaml
  - order-service.yaml
  - observability.yaml
  - alloy.yaml
  - keycloak/
configMapGenerator:
  - name: order-service-oidc
    literals:
      - auth-server-url=http://keycloak:8080/realms/orders
      - token-issuer=http://localhost:8180/realms/orders
      - jwks-path=/protocol/openid-connect/certs
