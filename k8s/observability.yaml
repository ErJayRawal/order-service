apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-prometheus-config
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/part-of: order-service
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: order-service
        metrics_path: /q/metrics
        static_configs:
          - targets: ["order-service:80"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: observability-data
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/part-of: order-service
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/part-of: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: observability
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability
        app.kubernetes.io/part-of: order-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.39.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: prometheus
              containerPort: 9090
            - name: loki
              containerPort: 3100
            - name: tempo-http
              containerPort: 3200
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: observability-credentials
                  key: grafana-admin-password
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: grafana
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: grafana
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: grafana
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: observability-data
              mountPath: /data
            - name: tempo-runtime
              mountPath: /var/tempo
            - name: prometheus-config
              mountPath: /otel-lgtm/prometheus.yaml
              subPath: prometheus.yaml
              readOnly: true
      volumes:
        - name: observability-data
          persistentVolumeClaim:
            claimName: observability-data
        - name: tempo-runtime
          emptyDir:
            sizeLimit: 256Mi
        - name: prometheus-config
          configMap:
            name: observability-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: observability
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/part-of: order-service
spec:
  type: ClusterIP
  ports:
    - name: grafana
      port: 3000
      targetPort: grafana
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: prometheus
      port: 9090
      targetPort: prometheus
    - name: loki
      port: 3100
      targetPort: loki
    - name: tempo-http
      port: 3200
      targetPort: tempo-http
  selector:
    app.kubernetes.io/name: observability
