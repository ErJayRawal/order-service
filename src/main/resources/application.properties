quarkus.http.host=0.0.0.0
quarkus.http.access-log.enabled=true
quarkus.application.name=order-service

quarkus.log.console.json.enabled=true
quarkus.log.console.json.pretty-print=false

quarkus.otel.service.name=order-service
quarkus.otel.traces.exporter=none
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=0.1

quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.token.audience=${OIDC_AUDIENCE:order-service}
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.token.subject-required=true

quarkus.datasource.db-kind=postgresql

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.quarkus.oidc.enabled=false